<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aiwa</title>
<style>
/* L'accueil d'Aiwa pour quelqu'un qui n'a pas encore de profil : tous les boutons, et un mot qui dit comment faire sa propre page (qui remplacera celle-ci). */
:root{color-scheme:dark;--ink:#f6f6ff;--dim:#aeb3e8;--acc:#52d6a0;--blue:#6b9bf5;--violet:#a77bd6;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(80% 55% at 70% 20%,#2b2170,transparent 70%),radial-gradient(70% 50% at 10% 90%,#0d4a55,transparent 70%),#06081a;color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
.stage{height:100svh;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px 16px;min-width:0}
.bar{font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;align-self:center;font-weight:900;font-size:clamp(64px,22vw,200px);letter-spacing:-.05em;line-height:.85}
p{margin:6px 0 0;max-width:28em;color:#d7dbff;font-size:clamp(14px,3.6vw,18px)}
.info{display:grid;gap:12px;min-width:0}
/* les boutons d'Aiwa : l'application les met dans les emplacements ; ici ils prennent la taille des cellules du widget */
.desk{display:grid;gap:6px;min-width:0}
.desk .row{display:grid;gap:6px;min-width:0}
.desk .build{grid-template-columns:minmax(0,2.6fr) repeat(4,minmax(0,1fr))}
.desk .files{grid-template-columns:repeat(3,minmax(0,1fr))}
.desk .tools{grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.desk .aiwa-btn{--c:var(--blue);all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:clamp(44px,7svh,58px);padding:6px 10px 6px 14px;cursor:pointer;color:var(--ink);font-size:clamp(12px,3.3vw,15px);font-weight:700;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04));backdrop-filter:blur(8px) saturate(1.3);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:filter .2s,transform .2s;-webkit-tap-highlight-color:transparent}
.desk .aiwa-btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 58%,transparent),transparent 92%)}
.desk .aiwa-btn svg{width:1.35em;height:1.35em;flex:none}
.desk .aiwa-btn span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.desk .aiwa-btn{min-width:0}
.stage,.info{min-width:0}
.desk .aiwa-btn:hover,.desk .aiwa-btn:focus-visible{filter:brightness(1.3);transform:translateY(-2px);outline:none}
.desk .aiwa-btn:active{filter:brightness(1.5);transform:scale(.97)}
.desk .aiwa-btn[data-tone=green]{--c:var(--acc)}.desk .aiwa-btn[data-tone=violet]{--c:var(--violet)}.desk .aiwa-btn[data-tone=orange]{--c:#e09a7c}.desk .aiwa-btn[data-tone=yellow]{--c:#e8c14a}.desk .aiwa-btn[data-tone=red]{--c:#ff6b6b}.desk .aiwa-btn[data-tone=grey]{--c:#9aa0d8}
.desk .aiwa-btn[data-on="1"]{box-shadow:inset 0 -2px 0 var(--c)}
.desk .aiwa-btn[data-found="0"]{opacity:.38}
.desk .build .aiwa-btn:not([data-id=agent]) span,.desk .tools .aiwa-btn span{display:none}
.desk .files .aiwa-btn{padding:6px 4px 6px 12px;font-size:clamp(10.5px,3vw,14px);gap:6px}
.desk .tools .aiwa-btn{min-height:clamp(36px,5.4svh,44px);padding:4px;clip-path:none;border-radius:10px}
.desk .tools .aiwa-btn::before{border-radius:10px}
.desk .build .aiwa-btn[data-id=agent]{font-size:clamp(13px,3.7vw,17px)}


@media (max-height:520px){p{display:none}.desk .files{grid-template-columns:repeat(6,minmax(0,1fr))}.desk .files .aiwa-btn span{display:none}}
</style></head><body>
<main class="stage">
  <div class="bar">Aiwa · accueil</div>
  <div><h1>Aiwa</h1><p>__WORD__</p></div>
  <section class="info desk" aria-label="Aiwa">
    <div class="row build" data-aiwa-slot="build"></div>
    <div class="row files" data-aiwa-slot="files"></div>
    <div class="row tools" data-aiwa-slot="domain voir" data-aiwa-look="icons"></div>
  </section>
</main></body></html>
