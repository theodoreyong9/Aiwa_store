name: CI

on:
  push:
    branches: [main, clean]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # the web app's tests run it in a real browser
      - run: npx -w aiwa-store-web playwright install --with-deps chromium
      - run: npm test
      # the real-network script, against a stand-in: keeps the script itself working (the real run is the Devnet check workflow)
      - run: node scripts/devnet-check.mjs --fake
      # the documents: every diagram renders, every § names a heading of the yellow paper
      - run: node scripts/check-diagrams.mjs
      # every diagram is also a picture in its document (a viewer that does not draw Mermaid shows nothing otherwise)
      - run: node scripts/render-diagrams.mjs --check
