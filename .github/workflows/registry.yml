name: Registry
# A pull request adds ONE file submissions/<name>.json. This workflow runs from the main branch's own code, reads that file
# as data (it never runs anything from the pull request), validates it, and if it is accepted writes store/ on main
# itself. The pull request is never merged: it is closed with the verdict.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths: ['submissions/**']

permissions:
  contents: write
  pull-requests: write
  actions: write

# store/ is written by one run at a time
concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: The registry's own code (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: The pull request's content, as data in _pr/
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: _pr
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Pick the one submission file
        id: pick
        run: |
          set -eu
          shopt -s nullglob
          files=(_pr/submissions/*.json)
          [ "${#files[@]}" -eq 1 ] || { echo "A pull request adds exactly one submissions/<name>.json (found ${#files[@]})" | tee "$RUNNER_TEMP/verdict.txt"; exit 1; }
          name=$(basename "${files[0]}")
          [[ "$name" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo "The file name is letters, digits, dot, underscore, hyphen" | tee "$RUNNER_TEMP/verdict.txt"; exit 1; }
          { [ -f "${files[0]}" ] && [ ! -L "${files[0]}" ]; } || { echo "The submission is not a regular file" | tee "$RUNNER_TEMP/verdict.txt"; exit 1; }
          cp "${files[0]}" "$RUNNER_TEMP/submission.json"

      - name: Validate, and write store/ if accepted
        id: process
        env:
          SOLANA_RPC: ${{ vars.SOLANA_RPC }}
        run: |
          set -o pipefail
          node registry/bin/process.mjs --submission "$RUNNER_TEMP/submission.json" 2>&1 | tee "$RUNNER_TEMP/verdict.txt"

      - name: Publish what changed
        run: |
          set -eu
          git config user.name 'aiwa-store registry'
          git config user.email 'registry@users.noreply.github.com'
          git add store
          git commit -m "Registry: $(head -c 200 "$RUNNER_TEMP/verdict.txt")"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Say it on the pull request, and close it
        if: always()
        uses: actions/github-script@v7
        env:
          VERDICT_FILE: ${{ runner.temp }}/verdict.txt
        with:
          script: |
            const fs = require('fs');
            let verdict = 'No verdict (the workflow stopped early).';
            try { verdict = fs.readFileSync(process.env.VERDICT_FILE, 'utf8').trim().slice(0, 2000); } catch {}
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.pull_request.number, body: verdict });
            await github.rest.pulls.update({ ...context.repo, pull_number: context.payload.pull_request.number, state: 'closed' });
