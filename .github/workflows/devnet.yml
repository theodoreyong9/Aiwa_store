name: Devnet check
# The one check that uses the REAL Solana network (devnet): burn with the creator fee, verification by the registry's own code.
#
# It needs a wallet that has devnet SOL: the faucet refuses shared runners (it limits each address and each IP per day), so the
# real run uses the recovery phrase of a wallet you funded yourself (faucet.solana.com), stored once as the repository secret
# DEVNET_PHRASE. Without it this workflow FAILS and says what to do (after a dry run against a stand-in network, which only shows
# that the script itself works and proves nothing about Solana): a green run that burned nothing on devnet would be a lie.
# Start it by hand: Actions → Devnet check → Run workflow.
on:
  workflow_dispatch:
    inputs:
      sol:
        description: SOL to burn (devnet)
        default: '0.01'
      T:
        description: Patience rate T, 0 to 0.4
        default: '0.4'
      epochs:
        description: Epochs to mine
        default: '2'

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dry run against a stand-in network (the script itself)
        run: node scripts/devnet-check.mjs --fake
      - name: Is there a funded wallet to burn with?
        env:
          DEVNET_PHRASE: ${{ secrets.DEVNET_PHRASE }}
        run: |
          if [ -z "$DEVNET_PHRASE" ]; then
            url="https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error title=Nothing was burned on devnet::There is no DEVNET_PHRASE secret. Fund a devnet wallet at faucet.solana.com, add its 12 words as the repository secret DEVNET_PHRASE ($url), run again."
            { echo "### Nothing was burned on devnet"; echo; echo "There is no \`DEVNET_PHRASE\` secret. Fund a devnet wallet at https://faucet.solana.com, add its 12 words as the repository secret \`DEVNET_PHRASE\` ([Settings → Secrets]($url)), run again."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Real run on devnet
        run: node scripts/devnet-check.mjs --sol "${{ inputs.sol }}" --T "${{ inputs.T }}" --epochs "${{ inputs.epochs }}"
        env:
          DEVNET_PHRASE: ${{ secrets.DEVNET_PHRASE }}
