name: Design catalogue

# Every week: read the two registries, visit what is new, failed or stale, and commit the catalogue (JSONL, pictures, observations).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      crawls:
        description: 'Visits at most'
        default: '20'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx -w aiwa-design-research playwright install --with-deps chromium
      - name: Sync
        run: node design-research/src/cli.js sync --crawls=${{ github.event.inputs.crawls || '20' }} | tee sync.json
      - name: Health (a registry that gives nothing is a markup change)
        run: |
          node -e "
          const t = require('fs').readFileSync('sync.json','utf8');
          const s = JSON.parse(t.slice(t.lastIndexOf('\n{') + 1));
          const dead = Object.entries(s.registries).filter(([, r]) => r.found === 0);
          if (dead.length) { console.error('no project found at: ' + dead.map(([n]) => n).join(', ') + '\n' + s.errors.slice(0, 10).join('\n')); process.exit(1); }
          "
      - name: Commit the catalogue
        if: always()
        run: |
          git config user.name "design-research"
          git config user.email "actions@users.noreply.github.com"
          git add design-research/catalog design-research/screenshots design-research/analysis
          git diff --cached --quiet || (git commit -m "Design catalogue: weekly sync" && git push)
