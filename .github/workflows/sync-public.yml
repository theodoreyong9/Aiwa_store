name: Sync public
# Copies the standards, the tools, the Termux backend and the papers into the public repository (see scripts/sync-public.sh), so that
# they stay readable without an account when this repository is private. It needs a secret, PUBLIC_REPO_TOKEN: a fine-grained token
# of the owner with "Contents: read and write" on the public repository only. Without it the step says so and does nothing.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'design-research/**'
      - 'video-kit/**'
      - 'android/backend/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'registry/**'
      - 'scripts/describe-site.mjs'
      - 'deployment.json'
      - 'store/index.json'
      - 'store/apps/**'
      - 'store/baselines/**'
      - 'scripts/sync-public.sh'
      - '.github/workflows/sync-public.yml'
  schedule:
    - cron: '17 5 * * *'      # the catalogue is committed by another workflow, which does not trigger this one
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The site is built HERE (from the private sources) and only its output goes to the public repository, whose own Pages workflow
      # publishes it. The registry's public files travel with it, as in the Pages workflow of this repository.
      - run: npm install
      - run: npm run build -w aiwa-store-web
      - run: node scripts/describe-site.mjs apps/web/dist
      - name: The registry's public files, next to the app
        run: |
          mkdir -p apps/web/dist/store
          cp store/index.json apps/web/dist/store/
          cp -r store/apps store/baselines apps/web/dist/store/ 2>/dev/null || true
      - name: Copy into the public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::notice::PUBLIC_REPO_TOKEN is not set: nothing is copied into the public repository."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${{ github.repository_owner }}/public.git" /tmp/public
          scripts/sync-public.sh /tmp/public
          rm -rf /tmp/public/site
          cp -r apps/web/dist /tmp/public/site
          cd /tmp/public
          git config user.name "aiwa-sync"
          git config user.email "aiwa-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "public repository already up to date"; exit 0; fi
          git commit -m "Sync from ${{ github.repository }}@${GITHUB_SHA::7}"
          git push origin HEAD:main
