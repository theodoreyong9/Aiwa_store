name: Pages
# The site: the web app, and the registry's public files (store/index.json, store/apps/) next to it. Run after a push that
# changes either, and by the registry workflow after it writes store/ (a push made with the workflow token starts no workflow).
#
# It needs Pages switched on ONCE, by the owner: Settings → Pages → Source: GitHub Actions. A workflow cannot do that with its
# own token. Until it is on, nothing is deployed, so this workflow FAILS and says exactly that: a green run that deployed
# nothing would be a lie. The Android app follows this site for its page (release.json lists the web app's files with their hashes),
# so what is published here is what the phones run.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', 'registry/**', 'scripts/describe-site.mjs', 'deployment.json', 'store/index.json', 'store/apps/**', 'store/baselines/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is Pages switched on for this repository?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --jq .build_type >/dev/null 2>&1; then
            url="https://github.com/${{ github.repository }}/settings/pages"
            echo "::error title=Pages is not switched on, so nothing was deployed::Open $url and choose Source: GitHub Actions. Then re-run this workflow."
            { echo "### Nothing was deployed: Pages is not switched on"; echo; echo "Open [Settings → Pages]($url), choose **Source: GitHub Actions**, then re-run this workflow (Actions → Pages → Run workflow)."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w aiwa-store-web
      # Described before anything else is put next to it: release.json lists the web app's files, not the registry's (which change
      # at each accepted app and which the Store reads from the site as data).
      - name: Describe the web app for the Android app
        run: node scripts/describe-site.mjs apps/web/dist
      - name: The registry's public files, next to the app
        run: |
          mkdir -p apps/web/dist/store
          cp store/index.json apps/web/dist/store/
          cp -r store/apps store/baselines apps/web/dist/store/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
