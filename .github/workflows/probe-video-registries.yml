name: Probe video registries

# One-off: what can an automated, polite reader learn from the film and advertising registries a session could draw on? For each site: its robots.txt,
# whether the listing pages answer to a plain request, how many project links they carry, which lines of its terms mention automated access, and whether a
# public oEmbed answer exists for the films it points to. The answers come back as annotations (the sandbox of the assistant cannot reach these sites).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        shell: bash
        run: |
          UA='Mozilla/5.0 (compatible; aiwa-design-research; +https://github.com/theodoreyong9/Aiwa_store)'
          emit() { local title="$1"; local body="$2"; body="${body//'%'/'%25'}"; body="${body//$'\r'/'%0D'}"; body="${body//$'\n'/'%0A'}"; echo "::notice title=${title}::${body:0:6000}"; }
          probe() {
            local name="$1" base="$2" listing="$3" pattern="$4" terms="$5"
            local out=""
            out+="robots.txt: $(curl -s -m 25 -A "$UA" -o r.txt -w '%{http_code}' "$base/robots.txt")"$'\n'
            out+="$(grep -i -E '^(user-agent|disallow|crawl-delay|allow)' r.txt | head -25)"$'\n'
            for p in $listing; do
              code=$(curl -s -m 30 -A "$UA" -L -o page.html -w '%{http_code} %{size_download}B' "$p")
              links=$(grep -o -E "$pattern" page.html | sort -u | wc -l)
              ld=$(grep -c 'application/ld+json' page.html)
              out+="listing $p -> $code, project links: $links, json-ld blocks: $ld"$'\n'
            done
            for t in $terms; do
              curl -s -m 30 -A "$UA" -L -o terms.html "$t"
              out+="terms $t: $(sed 's/<[^>]*>/ /g' terms.html | tr -s ' \n' ' ' | grep -o -i -E '.{80}(scrap|automat|robot|crawl|bot |spider|data mining|text and data).{120}' | head -4)"$'\n'
            done
            emit "$name" "$out"
          }
          probe "Ads of the World" "https://www.adsoftheworld.com" "https://www.adsoftheworld.com/ https://www.adsoftheworld.com/campaigns" 'href="/(campaigns|campaign)/[a-z0-9-]+"' "https://www.adsoftheworld.com/terms https://www.adsoftheworld.com/terms-of-service"
          probe "Vimeo Staff Picks" "https://vimeo.com" "https://vimeo.com/channels/staffpicks https://vimeo.com/channels/staffpicks/videos" 'href="/[0-9]{6,}"' "https://vimeo.com/terms https://vimeo.com/help/guidelines"
          echo "vimeo oembed:" ; code=$(curl -s -m 25 -A "$UA" -o oembed.json -w '%{http_code}' 'https://vimeo.com/api/oembed.json?url=https://vimeo.com/76979871'); emit "Vimeo oEmbed" "http $code"$'\n'"$(head -c 1500 oembed.json)"
          probe "The One Show" "https://www.oneclub.org" "https://www.oneclub.org/ https://www.oneclub.org/awards/theoneshow/ https://www.oneclub.org/awards/theoneshow/-winners" 'href="[^"]*(winners|work|entry)[^"]*"' "https://www.oneclub.org/terms-of-use https://www.oneclub.org/terms"
          probe "LBB" "https://lbbonline.com" "https://lbbonline.com/ https://lbbonline.com/work" 'href="/(work|news)/[0-9]+[^"]*"' "https://lbbonline.com/terms-and-conditions https://lbbonline.com/terms"
      - name: Can a film be fetched, one at a time?
        shell: bash
        run: |
          emit() { local title="$1"; local body="$2"; body="${body//'%'/'%25'}"; body="${body//$'\r'/'%0D'}"; body="${body//$'\n'/'%0A'}"; echo "::notice title=${title}::${body:0:4000}"; }
          pip install -q yt-dlp 2>&1 | tail -1
          for u in "https://vimeo.com/76979871" "https://www.youtube.com/watch?v=jNQXAC9IVRw"; do
            out=$(timeout 120 yt-dlp -F --no-warnings "$u" 2>&1 | tail -8)
            emit "yt-dlp $u" "$out"
          done
          timeout 200 yt-dlp -f 'best[height<=480]/worst' -o clip.%(ext)s --no-warnings "https://vimeo.com/76979871" 2>&1 | tail -3 > dl.txt; ls -la clip.* 2>/dev/null >> dl.txt
          emit "download test (vimeo)" "$(cat dl.txt)"
          sudo apt-get install -y -qq tesseract-ocr ffmpeg >/dev/null 2>&1 && emit "tools" "ffmpeg: $(ffmpeg -version | head -1) / tesseract: $(tesseract --version 2>&1 | head -1)"
