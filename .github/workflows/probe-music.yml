name: probe-music
on:
  push:
    branches: [clean]
    paths: ['.github/workflows/probe-music.yml', 'scripts/probe-music.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: incompetech
        run: python3 scripts/probe-music.py incompetech || true
      - name: oga
        run: python3 scripts/probe-music.py oga || true
