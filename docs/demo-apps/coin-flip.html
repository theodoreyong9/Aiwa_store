<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin flip</title>
<meta name="description" content="Heads or tails, with a tally of the last throws.">
<style>
  :root { --accent: #7c5cff; --ink: #1d1b26; --soft: #f3f1fb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 18px; font: 16px/1.4 system-ui, sans-serif; color: var(--ink); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 40px; text-align: left; }
  .coin { width: 170px; height: 170px; margin: 0 auto 36px; border-radius: 50%; display: grid; place-items: center; font: 800 28px system-ui; color: #fff; background: var(--accent); box-shadow: inset 0 0 0 10px rgba(255,255,255,.25); transition: transform .5s; }
  .coin.spin { transform: rotateY(720deg); }
  button { width: 100%; font: 700 18px system-ui; padding: 16px; border: 0; border-radius: 16px; background: var(--ink); color: #fff; }
  .log { margin-top: 22px; display: flex; gap: 6px; justify-content: center; }
  .log span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 13px system-ui; background: var(--soft); }
</style>
</head>
<body>
<h1>Coin flip</h1>
<div class="coin" id="coin">?</div>
<button id="flip">Flip</button>
<div class="log" id="log"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const last = [];
  $('flip').onclick = () => {
    const heads = Math.random() < 0.5;
    $('coin').classList.remove('spin'); void $('coin').offsetWidth; $('coin').classList.add('spin');
    setTimeout(() => {
      $('coin').textContent = heads ? 'Heads' : 'Tails';
      last.unshift(heads ? 'H' : 'T'); last.length = Math.min(last.length, 8);
      $('log').replaceChildren(...last.map((x) => Object.assign(document.createElement('span'), { textContent: x })));
    }, 250);
  };
</script>
</body>
</html>
