<!doctype html>
<!-- The screens of the 3D phones of the film v11 (600 x 1180): ?screen=off  the always-on display, the phone asleep and listening (the wake word is heard on the phone);
     ?screen=widget  the home screen with the Aiwa widget (drawn after the real one) obeying a spoken instruction. window.render(t) is a pure function of t (seconds from the start of the shot). -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
#s{position:relative;width:600px;height:1180px;overflow:hidden;font-family:"Liberation Sans",Arial,sans-serif;color:#f0f0f5}
.bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 20% 18%,#2a2168 0%,transparent 60%),radial-gradient(80% 60% at 85% 80%,#17484a 0%,transparent 60%),#0a0a14}
.sb{position:absolute;left:34px;right:34px;top:20px;display:flex;justify-content:space-between;font-size:22px;color:#c9c9d8}
.clock{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:150px;font-weight:300;letter-spacing:-4px;color:#8a8aa0}
.date{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:28px;color:#6c6c84}
.orb{position:absolute;left:250px;top:500px;width:100px;height:100px;border-radius:50%;background:#58d39b}
.wv{position:absolute;left:100px;top:660px;width:400px;height:120px;display:flex;gap:9px;align-items:center;justify-content:center}.wv i{display:block;width:10px;border-radius:5px;background:#58d39b}
.lbl{position:absolute;left:0;right:0;text-align:center;font-size:30px;color:#58d39b;font-weight:700}
.heard{position:absolute;left:60px;right:60px;top:860px;text-align:center;font-size:44px;font-weight:800;color:#fff;padding:18px 0;border-radius:60px;background:rgba(255,255,255,.1)}
.w{position:absolute;left:20px;top:300px;width:560px;border-radius:40px;background:linear-gradient(180deg,#1d1d26,#14141b);padding:20px;box-sizing:border-box;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.r{display:flex;align-items:center;gap:10px;margin-bottom:11px}.av{width:56px;height:56px;border-radius:50%;background:#2c2c36;color:#cc785c;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ti{font-size:28px;font-weight:800;letter-spacing:-.5px}.st{font-size:17px;color:#a4a4b4;margin-top:1px}
.c{border-radius:50%;flex:none;width:62px;height:62px;position:relative}.p{height:62px;border-radius:31px;background:#2c2c36;display:flex;align-items:center;padding:0 16px;font-size:20px;font-weight:600;flex:1;white-space:nowrap}.p.g{background:#2e7d5a}
.mic{height:74px;border-radius:37px;background:#54545e;flex:1;display:flex;align-items:center;justify-content:center;gap:12px;font-size:25px;font-weight:800}.rec{width:22px;height:22px;border-radius:50%;background:#d64541}
.dot{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#ff3b30;border:3px solid #14141b}
.chip{position:absolute;left:0;padding:11px 22px;border-radius:40px;font-size:27px;font-weight:700;background:#fff;color:#151520;white-space:nowrap;box-shadow:0 12px 36px rgba(0,0,0,.5)}.chip.ok{background:#2e7d5a;color:#fff}
.toast{position:absolute;padding:13px 28px;border-radius:40px;background:#e9fbf2;color:#0c3d28;font-size:31px;font-weight:800;white-space:nowrap;box-shadow:0 12px 50px rgba(46,125,90,.5)}
.dock{position:absolute;left:40px;right:40px;bottom:60px;display:flex;justify-content:space-between}.dock i{display:block;width:92px;height:92px;border-radius:26px}
</style></head><body><div id="s"></div>
<script>
const M = { clamp: (x) => Math.min(1, Math.max(0, x)), back: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const prog = (t, at, dur, f = (x) => x) => f(M.clamp((t - at) / dur));
const mode = new URLSearchParams(location.search).get('screen') || 'off';
const root = document.getElementById('s');
const $ = (id) => root.querySelector('#' + id);
if (mode === 'off') {
  root.innerHTML = `<div class="bg" style="background:#030306"></div><div class="sb"><span>●</span><span>écoute</span></div><div class="clock">02:14</div><div class="date">mardi 14 octobre</div>
  <div class="orb" id="o"></div><div class="wv" id="wv">${'<i></i>'.repeat(17)}</div><div class="lbl" id="l" style="top:810px">À l'écoute</div><div class="heard" id="h">« Aïwa »</div>`;
  window.render = (t) => {
    const k = prog(t, 0.2, 0.5);
    $('o').style.opacity = k * (0.6 + 0.4 * Math.sin(t * 5)); $('o').style.boxShadow = `0 0 ${60 + 30 * Math.sin(t * 5)}px #58d39b`;
    [...$('wv').children].forEach((b, i) => { b.style.height = (10 + 90 * Math.abs(Math.sin(t * 6 + i * 0.7)) * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.7 + i * 0.3))) * (t > 0.6 ? 1 : 0.2)) + 'px'; });
    $('wv').style.opacity = prog(t, 0.5, 0.4); $('l').style.opacity = prog(t, 0.6, 0.4);
    const h = prog(t, 1.9, 0.4, M.back); $('h').style.opacity = M.clamp(h); $('h').style.transform = `scale(${0.9 + 0.1 * Math.min(1, h)})`;
  };
} else {
  root.innerHTML = `<div class="bg"></div><div class="sb"><span>02:14</span><span>▮▮▮ ◔</span></div>
  <div class="w" id="W">
    <div class="r"><div class="av">A</div><div style="flex:1"><div class="ti">Refonte du widget Aiwa ▾</div><div class="st" id="wst">Prêt</div></div><div class="c" style="background:#cc785c"></div></div>
    <div class="r"><div class="p" id="pR">⎇ aiwa_store ▾</div><div class="p" id="pM">Opus 5.5 ▾</div></div>
    <div class="r"><div class="p g" id="pP">Push main</div><div class="p g" id="pD">Pages ●</div><div class="c" style="background:#cc785c"><div class="dot" id="rd" style="opacity:0"></div></div></div>
    <div class="r" style="margin-bottom:0"><div class="c" style="background:#2c2c36;width:74px;height:74px"></div><div class="mic"><span class="rec"></span><span id="mt">Dicter un message</span><span id="wv" style="display:none;gap:5px;align-items:center;height:44px">${'<i style="display:block;width:6px;border-radius:3px;background:#fff"></i>'.repeat(9)}</span></div></div>
  </div>
  <div class="chip" id="k1" style="left:36px;top:622px">modèle Sonnet</div><div class="chip" id="k2" style="left:300px;top:622px">push branche</div>
  <div class="chip" id="k3" style="left:36px;top:700px">déploiement Android</div><div class="chip" id="k4" style="left:350px;top:700px">dépôt Jobber</div>
  <div class="chip ok" id="k5" style="left:110px;top:790px">« C'est bon vas-y »</div><div class="toast" id="tr" style="left:150px;top:880px">● C'est prêt.</div>
  <div class="dock"><i style="background:#2b3a67"></i><i style="background:#3a2b67"></i><i style="background:#cc785c"></i><i style="background:#26324a"></i></div>`;
  window.render = (t) => {
    const show = (el, at) => { const p = prog(t, at, 0.4, M.back); el.style.opacity = M.clamp(p); el.style.transform = `translateY(${(1 - Math.min(1, p)) * 22}px) scale(${0.9 + 0.1 * Math.min(1, p)})`; };
    const flash = (el, at) => { const k = Math.max(0, 1 - Math.abs(t - at - 0.25) / 0.4); el.style.boxShadow = k > 0 ? `0 0 0 ${5 * k}px rgba(255,255,255,${0.55 * k})` : 'none'; };
    const B = 0.5769, a = (n) => 1.2 + n * B;
    show($('k1'), a(1)); flash($('pM'), a(1)); show($('k2'), a(2)); flash($('pP'), a(2)); show($('k3'), a(3)); flash($('pD'), a(3)); show($('k4'), a(4)); flash($('pR'), a(4));
    show($('k5'), a(6)); show($('tr'), a(8));
    const listening = t > 0.5 && t < a(7.6);
    $('wst').textContent = t < 0.5 ? 'Prêt' : listening ? 'À l\'écoute' : 'C\'est fait.'; $('wst').style.color = !listening && t >= a(7.6) ? '#58d39b' : '#a4a4b4';
    $('mt').style.display = listening ? 'none' : 'inline'; $('wv').style.display = listening ? 'flex' : 'none';
    [...$('wv').children].forEach((b, i) => { b.style.height = (8 + 34 * Math.abs(Math.sin(t * 7 + i * 0.9))) + 'px'; });
    $('rd').style.opacity = t >= a(8) ? 1 : 0;
  };
}
window.READY = Promise.resolve();
</script></body></html>
