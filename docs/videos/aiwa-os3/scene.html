[[-2.3,0,0x7a5cff,3.2],[2.0,0,0x22d6a0,3.0],[2.7,0,0x3f8cff,3.0]].forEach(([x,y,c,h],i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.035,h,.03),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(2.2),toneMapped:false}));m.position.set(x,y+h/2,-2.46);scene.add(m);strips.push(m);
  const l=new THREE.PointLight(c,.9,4,2);l.position.set(x,y+.4,-2.1);scene.add(l);wlights.push(l)});

for(let i=0;i<9;i++){const h=.16+rnd(i)*.1;const b=new THREE.Mesh(new THREE.BoxGeometry(.04+rnd(i+9)*.03,h,.2),M({color:new THREE.Color().setHSL(rnd(i+3),.35,.22),roughness:.7}));b.position.set(.45+i*.075,1.17+h/2,-2.3);scene.add(b)}

 const land=Math.sin(x*3.1+1)*Math.cos(y*2.7)+Math.sin(z*4.2+y*1.7)*.6+Math.cos(x*5+z*3)*.3;const b=land>.15?1:.25;gc[i*3]=.35*b;gc[i*3+1]=.6*b;gc[i*3+2]=1*b}

 [0,[.30,.20,.62],[.30,.12,.1],34],[5.6,[.29,.17,.58],[.28,.1,.1],34],[6.4,[.27,.14,.5],[.27,.1,.1],32],
 [9.2,[.30,.16,.62],[.25,.1,.05],34],[11.5,[.42,.27,1.1],[.08,.34,-.5],38],[14.0,[.52,.34,1.55],[-.02,.45,-.7],40],
 [16.5,[.46,.36,1.34],[.1,.5,-.5],40],[18.5,[.22,.32,.80],[.27,.31,.0],36],[20.7,[.18,.32,.78],[.27,.31,.0],36],
 [23.0,[.26,.42,1.2],[.04,.55,-.55],40],[26.0,[.18,.52,1.0],[-.08,.65,-.9],38],[28.4,[.55,.38,1.05],[.35,.34,.0],38],
 [31.0,[.72,.36,.82],[.76,.34,.1],34],[34.5,[.9,.40,.78],[.76,.34,.1],34],[37.5,[.62,.5,.96],[.74,.33,.1],37],
 [40.2,[.25,.46,1.2],[.1,.34,.1],42],[42.5,[-.26,.40,.78],[-.56,.33,.0],38],[45.0,[-.2,.55,1.0],[-.2,.55,-.5],40],
 [47.5,[-.1,.76,.30],[-.12,.78,-1.5],40],[50.0,[-.12,.77,-.15],[-.12,.78,-1.5],37],[53.0,[-.1,.8,.9],[-.12,.78,-1.5],40],
 [57.0,[0,.9,2.4],[-.12,.8,-1.5],42],[67,[0,.9,3.4],[-.12,.8,-1.5],44]];
function hermite(p0,p1,m0,m1,s){const s2=s*s,s3=s2*s;return p0*(2*s3-3*s2+1)+m0*(s3-2*s2+s)+p1*(-2*s3+3*s2)+m1*(s3-s2)}

// ---------- phone / dot choreography ----------

 const up=sm5(ramp(t,16.6,19.6)),down=sm5(ramp(t,28.2,30.4));
