// ---- 2. the stack ------------------------------------------------------------------------------------------------------------------------
const STACK = `<div class="card" id="s0" style="left:0;top:80px;width:500px;height:300px;padding:40px"><div style="width:100px;height:100px;border-radius:30px;background:#24242f;display:flex;align-items:center;justify-content:center">${ic(I.branch, 62)}</div><div style="font-size:64px;font-weight:800;margin-top:26px;letter-spacing:-2px">GitHub</div></div>

const WCSS = `.w{position:absolute;left:30px;top:20px;width:940px;border-radius:64px;background:linear-gradient(180deg,#1d1d26,#14141b);padding:30px;box-sizing:border-box;box-shadow:0 50px 140px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.07);font-family:${FF};color:#f0f0f5}

const WIDGET = `<div class="w" id="W">
  <div class="r" style="margin-bottom:22px"><div class="av">A</div><div style="flex:1"><div class="ti">Refonte du widget Aiwa ▾</div><div class="st" id="wst">Prêt</div></div><div class="c" style="width:104px;height:104px;background:#cc785c">${ic(I.star)}</div></div>

</div>
<div class="chip" id="k1" style="left:60px;top:640px">modèle Sonnet</div>
<div class="chip" id="k2" style="left:500px;top:640px">push branche</div>
<div class="chip" id="k3" style="left:60px;top:770px">déploiement Android</div>
<div class="chip" id="k4" style="left:610px;top:770px">dépôt Jobber</div>
<div class="chip ok" id="k5" style="left:230px;top:905px">« C'est bon vas-y »</div>
<div class="toast" id="tr" style="left:290px;top:1020px">● C'est prêt.</div>`;
function widgetTick(root, t, M) {
  const $ = (id) => root.querySelector('#' + id);
  const show = (el, at, dur = 0.45) => { const p = M.prog(t, at, dur, M.ease.outBack); el.style.opacity = M.clamp(p); el.style.transform = `translateY(${(1 - Math.min(1, p)) * 30}px) scale(${0.9 + 0.1 * Math.min(1, p)})`; };
  const flash = (el, at) => { const k = Math.max(0, 1 - Math.abs(t - at - 0.3) / 0.45); el.style.boxShadow = k > 0 ? `0 0 0 ${6 * k}px rgba(255,255,255,${0.55 * k}), 0 0 ${60 * k}px rgba(255,255,255,${0.35 * k})` : 'none'; };
  const s = 1.6;   // the sequence starts 1.6 s into the shot
  [['k1', 0.8, 'pM'], ['k2', 1.45, 'pP'], ['k3', 2.1, 'pD'], ['k4', 2.75, 'pR']].forEach(([k, at, pill]) => { show($(k), at + s); flash($(pill), at + s); });
  show($('k5'), 3.4 + s); show($('tr'), 4.1 + s);
  const listening = t > 0.4 + s && t < 3.9 + s;
  $('wst').textContent = t < 0.4 + s ? 'Prêt' : listening ? 'À l\'écoute' : 'C\'est fait.';
  $('wst').style.color = t >= 3.9 + s ? '#58d39b' : '#a4a4b4';
  $('mt').style.display = listening ? 'none' : 'inline'; $('wv').style.display = listening ? 'flex' : 'none';
  [...$('wv').children].forEach((b, i) => { b.style.height = (14 + 50 * Math.abs(Math.sin(t * 7 + i * 0.9)) * (0.5 + 0.5 * Math.sin(t * 2.3 + i))) + 'px'; });
  $('rd').style.opacity = t >= 4.1 + s ? 1 : 0;
}
