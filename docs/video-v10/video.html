     Real captures: real/wallet.png, real/papers.png (the web app). What is an example or a vision says so on the picture. See facts.md, brief.md, style.md, script.md. -->

<script>

const FF = '"Liberation Sans",Arial,sans-serif';
const BAR = 240 / 104, BEAT = BAR / 4, T0 = 0.029, TR = 0.35;           // the track: 104 bpm, its first beat at 0.029 s
const bt = (n) => 0.2 + n * BEAT;                                       // the n-th beat of a shot (a shot starts a little before its beat)

const rv = (el, t, at, dur = 0.5, dy = 40) => { const p = M.prog(t, at, dur, M.ease.outBack); el.style.opacity = M.clamp(p); el.style.transform = `translateY(${(1 - Math.min(1, p)) * dy}px) scale(${0.94 + 0.06 * Math.min(1, p)})`; return p; };
const $$ = (root, sel) => [...root.querySelectorAll(sel)];
const G = (id) => (root) => root.querySelector('#' + id);

// ---- 3. the stack ------------------------------------------------------------------------------------------------------------------------
const sc = (i, col, svg, name) => `<div class="card" id="s${i}" style="left:${i * 540}px;top:80px;width:500px;height:300px;padding:40px"><div style="width:100px;height:100px;border-radius:30px;background:${col};display:flex;align-items:center;justify-content:center">${ic(svg, 62)}</div><div style="font-size:64px;font-weight:800;margin-top:26px;letter-spacing:-2px">${name}</div></div>`;
const STACK = sc(0, '#24242f', I.branch, 'GitHub') + sc(1, ORA, I.term, 'Claude Code') + sc(2, GRN, I.phone, 'Android')

// ---- 5. screen off ------------------------------------------------------------------------------------------------------------------------
const OFF = `<div class="k" id="o0" style="left:430px;top:0;width:520px;height:900px;border-radius:84px;background:#0d0d14;border:10px solid #3a3a4c;box-shadow:0 60px 160px rgba(0,0,0,.8)"></div>

<svg class="k" id="o2" style="left:430px;top:540px" width="520" height="140" viewBox="0 0 520 140">${Array.from({ length: 21 }, (_, i) => `<rect class="wv" x="${40 + i * 22}" y="60" width="10" height="20" rx="5" fill="${GRN}" opacity=".85"/>`).join('')}</svg>
<div class="pill" id="o3" style="left:1040px;top:250px;height:104px;padding:0 44px;font-size:48px;background:#fff;color:#151520;display:flex;align-items:center">« Aïwa »</div>

<div class="k" id="o5" style="left:1040px;top:560px;font-size:40px;color:#b4b4c8;width:520px;line-height:1.35">Tu le choisis toi-même.<br>Même <b style="color:#fff">Aïwa</b>.</div>`;
const offTick = (r, t) => { rv(G('o0')(r), t, bt(0), 0.6, 60); G('o1')(r).style.opacity = M.prog(t, bt(1.2), 0.4) * (0.65 + 0.35 * Math.sin(t * 5)); G('o2')(r).style.opacity = M.prog(t, bt(1.6), 0.4);
  $$(r, '.wv').forEach((e, i) => { const h = 14 + 80 * Math.abs(Math.sin(t * 6 + i * 0.7)) * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.7 + i * 0.3))) * (t > bt(2) ? 1 : 0.2); e.setAttribute('height', h); e.setAttribute('y', 70 - h / 2); });
  rv(G('o3')(r), t, bt(2.5)); rv(G('o4')(r), t, bt(4), 0.5, 20); rv(G('o5')(r), t, bt(5.5), 0.5, 20); };

// ---- 6. the widget as it is on the phone ----------------------------------------------------------------------------------------------------
const WCSS = `.w{position:absolute;left:30px;top:20px;width:940px;border-radius:64px;background:linear-gradient(180deg,#1d1d26,#14141b);padding:30px;box-sizing:border-box;box-shadow:0 50px 140px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.07);font-family:${FF};color:#f0f0f5}
.w .r{display:flex;align-items:center;gap:16px}.w .av{width:92px;height:92px;border-radius:50%;background:#2c2c36;color:#cc785c;font-size:48px;font-weight:700;display:flex;align-items:center;justify-content:center}

const WIDGET = `<div class="w" id="W">

  <div class="r" style="margin-bottom:18px"><div class="p" id="pR">⎇ aiwa_store ▾</div><div class="p" id="pM">Opus 5.5 ▾</div></div>
  <div class="r" style="margin-bottom:18px"><div class="p g" id="pP">Push main</div><div class="p g" id="pD">Pages ●</div><div class="c" style="width:104px;height:104px;background:#cc785c">${ic(I.globe)}<div class="dot" id="rd" style="opacity:0"></div></div><div class="c" style="width:104px;height:104px;background:#2e7d5a">${ic(I.play, 44)}</div></div>

<div class="toast" id="tr" style="left:290px;top:1020px">● C'est prêt.</div>`;
function widgetTick(root, t, M) {
  const $ = (id) => root.querySelector('#' + id);
  const show = (el, at, dur = 0.4) => { const p = M.prog(t, at, dur, M.ease.outBack); el.style.opacity = M.clamp(p); el.style.transform = `translateY(${(1 - Math.min(1, p)) * 30}px) scale(${0.9 + 0.1 * Math.min(1, p)})`; };
  const flash = (el, at) => { const k = Math.max(0, 1 - Math.abs(t - at - 0.25) / 0.4); el.style.boxShadow = k > 0 ? `0 0 0 ${6 * k}px rgba(255,255,255,${0.55 * k}), 0 0 ${60 * k}px rgba(255,255,255,${0.35 * k})` : 'none'; };
  const a = [bt(4), bt(5), bt(6), bt(7)], pills = ['pM', 'pP', 'pD', 'pR'];
  ['k1', 'k2', 'k3', 'k4'].forEach((k, i) => { show($(k), a[i]); flash($(pills[i]), a[i]); });
  show($('k5'), bt(8.5)); show($('tr'), bt(10.5));
  const listening = t > bt(3) && t < bt(10.4);
  $('wst').textContent = t < bt(3) ? 'Prêt' : listening ? 'À l\'écoute' : 'C\'est fait.';
  $('wst').style.color = !listening && t >= bt(10.4) ? '#58d39b' : '#a4a4b4';
  $('mt').style.display = listening ? 'none' : 'inline'; $('wv').style.display = listening ? 'flex' : 'none';
  [...$('wv').children].forEach((b, i) => { b.style.height = (14 + 50 * Math.abs(Math.sin(t * 7 + i * 0.9)) * (0.5 + 0.5 * Math.sin(t * 2.3 + i))) + 'px'; });
  $('rd').style.opacity = t >= bt(10.5) ? 1 : 0;
}

// ---- 7. what it makes ------------------------------------------------------------------------------------------------------------------------

const pl = (id, left, txt) => `<div class="pill" id="${id}" style="left:${left}px;top:610px;height:96px;padding:0 40px;font-size:36px;display:flex;align-items:center;gap:16px;background:#262636">${ic(I.check, 40, GRN, 2.6)}${txt}</div>`;

<div class="pill" id="l3" style="left:560px;top:20px;height:90px;padding:0 40px;font-size:36px;display:flex;align-items:center;gap:14px;background:#262636">${ic(I.loop, 44)}des sessions qui conversent entre elles</div>`;

  const a = G('la')(r), b = G('lb')(r), A = G('dA')(r), B = G('dB')(r), on = M.prog(t, bt(2), 0.3);

const KEEP = [[0, 0], [1, 1], [2, 2], [3, 4], [5, 10], [6, 14], [7, 18], [10, 26], [11, 30], [12, 32], [13, 34], [14, 36], [17, 43], [19, 54], [22, 65], [23, 68]];   // [index in PLAN, the bar it starts on]

{
  const q = new URLSearchParams(location.search).get('g');
  const [b0, b1] = q ? q.split('-').map(Number) : [0, 71];
  const plan = PLAN2.filter((p) => p.bar >= b0 && p.bar < b1);
  const start = (b) => (b === b0 ? 0 : (b - b0) * BAR - TR / 2);
  window.SHOTS = plan.map((p, i) => {
    const next = plan[i + 1];
    const seconds = next ? start(next.bar) - start(p.bar) + TR : (b1 - b0) * BAR - start(p.bar) + (p.tail || 0);
    const shot = { seconds: Math.round(seconds * 1000) / 1000, bg: p.bg, layers: p.layers };
    if (p.trans && p.bar !== b0) shot.transition = { type: p.trans, seconds: TR };
    return shot;
  });
