<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body><div id="stage"></div>
<script src="../../video-kit/template/motion.js"></script>
<script>
const P = innerHeight / innerWidth >= 1.2;                      // portrait
const VIO = '#7b61ff', TEA = '#26c6b0', ORA = '#cc785c', GRN = '#58d39b', RED = '#d64541', MUT = '#8c8ca0';
window.THEME = { bg: '#090912', ink: '#f0f0f5', muted: MUT, accent: ORA, grain: 0.06, vignette: 0.5 };

// ---- the widget, as it is on the phone (design size 1000 x 1140) ----------------------------------------------------------------------
const WCSS = `
.w{position:absolute;left:30px;top:20px;width:940px;border-radius:64px;background:linear-gradient(180deg,#1d1d26,#14141b);padding:30px;box-sizing:border-box;box-shadow:0 50px 140px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.07);font-family:"Liberation Sans",Arial,sans-serif;color:#f0f0f5}
.w .r{display:flex;align-items:center;gap:16px}.w .av{width:92px;height:92px;border-radius:50%;background:#2c2c36;color:#cc785c;font-size:48px;font-weight:700;display:flex;align-items:center;justify-content:center}
.w .ti{font-size:46px;font-weight:800;letter-spacing:-1px}.w .st{font-size:26px;color:#a4a4b4;margin-top:2px}
.w .c{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.w .p{height:104px;border-radius:52px;background:#2c2c36;display:flex;align-items:center;padding:0 26px;font-size:34px;font-weight:600;flex:1;white-space:nowrap;min-width:0}
.w .p.g{background:#2e7d5a}.w .mic{height:124px;border-radius:62px;background:#54545e;flex:1;display:flex;align-items:center;justify-content:center;gap:20px;font-size:42px;font-weight:800}
.w .rec{width:36px;height:36px;border-radius:50%;background:#d64541}.w .wave{display:flex;gap:7px;align-items:center;height:70px}.w .wave i{display:block;width:9px;border-radius:5px;background:#fff}
.w .dot{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:#ff3b30;border:4px solid #14141b}
.chip{position:absolute;padding:18px 36px;border-radius:60px;font-size:46px;font-weight:700;background:#fff;color:#151520;white-space:nowrap;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:"Liberation Sans",Arial,sans-serif}
.chip.ok{background:#2e7d5a;color:#fff}.toast{position:absolute;padding:22px 44px;border-radius:60px;background:#e9fbf2;color:#0c3d28;font-size:52px;font-weight:800;white-space:nowrap;box-shadow:0 20px 80px rgba(46,125,90,.5);font-family:"Liberation Sans",Arial,sans-serif}`;
const ic = (d, s = 50) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const GLOBE = '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>';
const PLAY = '<path d="M8 5l11 7-11 7z" fill="#fff"/>';
const CHAT = '<path d="M4 5h16v11H9l-5 4z"/>';
const STAR = '<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>';
const WIDGET = `<div class="w" id="W">
  <div class="r" style="margin-bottom:22px"><div class="av">A</div><div style="flex:1"><div class="ti">Refonte du widget Aiwa ▾</div><div class="st" id="wst">Prêt</div></div><div class="c" style="width:104px;height:104px;background:#cc785c">${ic(STAR)}</div></div>
  <div class="r" style="margin-bottom:18px"><div class="p" id="pR">⎇ aiwa_store ▾</div><div class="p" id="pM">Opus 5.5 ▾</div></div>
  <div class="r" style="margin-bottom:18px"><div class="p g" id="pP">Push main</div><div class="p g" id="pD">Pages ●</div><div class="c" style="width:104px;height:104px;background:#cc785c">${ic(GLOBE)}<div class="dot" id="rd" style="opacity:0"></div></div><div class="c" style="width:104px;height:104px;background:#2e7d5a">${ic(PLAY, 44)}</div></div>
  <div class="r"><div class="c" style="width:124px;height:124px;background:#2c2c36">${ic(CHAT, 52)}</div><div class="mic"><span class="rec"></span><span id="mt">Dicter un message</span><span class="wave" id="wv" style="display:none">${'<i></i>'.repeat(9)}</span></div></div>
</div>
<div class="chip" id="k1" style="left:60px;top:640px">modèle Sonnet</div>
<div class="chip" id="k2" style="left:500px;top:640px">push branche</div>
<div class="chip" id="k3" style="left:60px;top:770px">déploiement Android</div>
<div class="chip" id="k4" style="left:610px;top:770px">dépôt Jobber</div>
<div class="chip ok" id="k5" style="left:230px;top:905px">« C'est bon vas-y »</div>
<div class="toast" id="tr" style="left:290px;top:1020px">● C'est prêt.</div>`;
function widgetTick(root, t, M) {
  const $ = (id) => root.querySelector('#' + id);
  const show = (el, at, dur = 0.45) => { const p = M.prog(t, at, dur, M.ease.outBack); el.style.opacity = M.clamp(p); el.style.transform = `translateY(${(1 - Math.min(1, p)) * 30}px) scale(${0.9 + 0.1 * Math.min(1, p)})`; };
  const flash = (el, at) => { const k = Math.max(0, 1 - Math.abs(t - at - 0.3) / 0.45); el.style.boxShadow = k > 0 ? `0 0 0 ${6 * k}px rgba(255,255,255,${0.55 * k}), 0 0 ${60 * k}px rgba(255,255,255,${0.35 * k})` : 'none'; };
  [['k1', 1.3, 'pM'], ['k2', 2.5, 'pP'], ['k3', 3.7, 'pD'], ['k4', 4.9, 'pR']].forEach(([k, at, pill]) => { show($(k), at); flash($(pill), at); });
  show($('k5'), 6.1); show($('tr'), 7.3);
  const listening = t > 0.6 && t < 6.9;
  $('wst').textContent = t < 0.6 ? 'Prêt' : listening ? 'À l\'écoute' : 'C\'est fait.';
  $('wst').style.color = t >= 6.9 ? '#58d39b' : '#a4a4b4';
  $('mt').style.display = listening ? 'none' : 'inline'; $('wv').style.display = listening ? 'flex' : 'none';
  [...$('wv').children].forEach((b, i) => { b.style.height = (14 + 50 * Math.abs(Math.sin(t * 7 + i * 0.9)) * (0.5 + 0.5 * Math.sin(t * 2.3 + i))) + 'px'; });
  $('rd').style.opacity = t >= 7.3 ? 1 : 0;
}

// ---- cards ---------------------------------------------------------------------------------------------------------------------------
const CCSS = `.cd{position:absolute;border-radius:48px;background:linear-gradient(180deg,#1d1d28,#15151d);border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 100px rgba(0,0,0,.6);padding:36px 40px;box-sizing:border-box;font-family:"Liberation Sans",Arial,sans-serif;color:#f0f0f5;display:flex;align-items:center;gap:32px}
.cd .ib{width:120px;height:120px;border-radius:34px;display:flex;align-items:center;justify-content:center;flex:none}.cd b{display:block;font-size:${P?58:44}px;letter-spacing:-1px}.cd span{display:block;font-size:${P?38:40}px;color:#a4a4bc;margin-top:8px;line-height:1.2}`;
const card = (i, col, svg, title, sub, style) => `<div class="cd" id="cd${i}" style="${style}"><div class="ib" style="background:${col}">${ic(svg, 62)}</div><div><b>${title}</b><span>${sub}</span></div></div>`;
const PHONE = '<rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.5h2"/>';
const CHECK = '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M8.5 12l2.6 2.6L15.8 9.8"/>';
const CARDS = P
  ? card(0, VIO, GLOBE, 'Site web', 'en ligne sur GitHub Pages', 'left:0;top:0;width:1000px;height:260px')
    + card(1, TEA, PHONE, 'Application Android', 'un APK construit pour toi', 'left:0;top:310px;width:1000px;height:260px')
    + card(2, ORA, CHECK, 'Contrat Aiwa', 'des règles que chacun vérifie', 'left:0;top:620px;width:1000px;height:260px')
  : card(0, VIO, GLOBE, 'Site web', 'en ligne sur<br>GitHub Pages', 'left:0;top:0;width:560px;height:340px;flex-direction:column;align-items:flex-start;justify-content:center')
    + card(1, TEA, PHONE, 'Application Android', 'un APK construit<br>pour toi', 'left:570px;top:0;width:560px;height:340px;flex-direction:column;align-items:flex-start;justify-content:center')
    + card(2, ORA, CHECK, 'Contrat Aiwa', 'des règles que<br>chacun vérifie', 'left:1140px;top:0;width:560px;height:340px;flex-direction:column;align-items:flex-start;justify-content:center');
function cardsTick(root, t, M) {
  for (let i = 0; i < 3; i++) { const el = root.querySelector('#cd' + i), p = M.prog(t, 0.7 + i * 0.5, 0.7, M.ease.outBack); el.style.opacity = M.clamp(p); el.style.transform = `translateY(${(1 - Math.min(1, p)) * 60}px) scale(${0.92 + 0.08 * Math.min(1, p)})`; }
}
// ---- agent rows ------------------------------------------------------------------------------------------------------------------------
const row = (i, col, name, sub) => `<div class="cd" id="rw${i}" style="left:0;top:${i * 230}px;width:1000px;height:200px;gap:28px"><div style="width:14px;height:120px;border-radius:7px;background:${col};flex:none"></div><div><b style="font-size:64px">${name}</b><span style="font-size:${P?40:38}px">${sub}</span></div></div>`;
const ROWS = row(0, VIO, 'Design', 'références mesurées, captures de contrôle') + row(1, TEA, 'Jeu', 'un process par étapes vérifiées, une partie jouée avant la livraison') + row(2, ORA, 'Vidéo', 'brief, script, rendu image par image, contrôle automatique');
function rowsTick(root, t, M) {
  for (let i = 0; i < 3; i++) { const el = root.querySelector('#rw' + i), p = M.prog(t, 0.6 + i * 0.55, 0.6, M.ease.outBack); el.style.opacity = M.clamp(p); el.style.transform = `translateX(${(1 - Math.min(1, p)) * 90}px)`; }
}
// ---- ranking bars ---------------------------------------------------------------------------------------------------------------------
const BARS = [92, 74, 58, 41].map((w, i) => `<div style="position:absolute;left:0;top:${i * 150}px;display:flex;align-items:center;gap:30px;width:1000px"><div style="font-size:70px;font-weight:800;color:${VIO};width:80px;text-align:center;font-family:'Liberation Sans',Arial,sans-serif">${i + 1}</div><div id="br${i}" data-w="${w}" style="height:110px;border-radius:30px;background:linear-gradient(90deg,${VIO},${TEA});width:0;transform-origin:left"></div></div>`).join('');
function barsTick(root, t, M) { for (let i = 0; i < 4; i++) { const el = root.querySelector('#br' + i); el.style.width = (M.prog(t, 0.5 + i * 0.35, 1.0, M.ease.outExpo) * Number(el.dataset.w) * 8.4) + 'px'; } }

// ---- the shots ----------------------------------------------------------------------------------------------------------------------------
const pair = (before, thing, proof, bg, color) => ({ seconds: 3.7, transition: { type: 'push-up', seconds: 0.45 }, bg, layers: [
  { type: 'text', text: before, size: [5, 3.6], weight: 600, color: MUT, y: [31, 28], effect: 'rise', at: 0.15 },
  { type: 'text', text: thing, size: [11.5, 8.6], y: [44, 46], effect: 'mask', at: 0.4, dur: 0.7 },
  { type: 'shape', kind: 'bar', x: 50, y: [44.5, 46.5], w: [78, 44], h: [1.0, 0.8], color: RED, at: 1.2, dur: 0.35, from: { s: 0 } },
  { type: 'text', text: proof, size: [11.5, 8.6], color, y: [64, 68], effect: 'scale', at: 1.7, dur: 0.55 },
] });
window.SHOTS = [
  // hook
  { seconds: 6.4, bg: { type: 'blobs', colors: ['rgba(123,97,255,.40)', 'rgba(38,198,176,.25)', 'rgba(204,120,92,.22)'], base: '#090912' }, layers: [
    { type: 'text', text: 'Pour tout,\nun intermédiaire.', mode: 'lines', effect: 'mask', size: [10.5, 9.6], y: 45, at: 0.3, stagger: 0.28, out: { at: 2.35, effect: 'mask' } },
    { type: 'text', text: 'Et si chacun\ndevenait\nune preuve ?', mode: 'lines', effect: 'scale', size: [10.5, 9.6], y: 47, at: 3.4, stagger: 0.22, accent: { preuve: VIO, '?': VIO } },
  ] },
  pair('Pour construire', 'Une plateforme.', 'ton dépôt ✓', { type: 'gradient', colors: ['#14102a', '#090912'], angle: 160, drift: true }, TEA),
  pair('Pour publier', 'Une permission.', 'volonté prouvée ✓', { type: 'gradient', colors: ['#0f1f26', '#090912'], angle: 200, drift: true }, GRN),
  pair('Pour payer', 'Une avance.', 'une signature ✓', { type: 'gradient', colors: ['#241413', '#090912'], angle: 150, drift: true }, ORA),
  pair('Pour s\'accorder', 'Une horloge.', 'la cause ✓', { type: 'gradient', colors: ['#171433', '#090912'], angle: 190, drift: true }, VIO),
  // manifesto
  { seconds: 4, transition: { type: 'flash', seconds: 0.5 }, bg: { type: 'blobs', colors: ['rgba(123,97,255,.5)', 'rgba(38,198,176,.3)', 'rgba(30,30,70,.5)'], base: '#090912' }, layers: [
    { type: 'text', text: 'Remplacer les intermédiaires\npar des preuves.', mode: 'lines', effect: 'mask', size: [8.6, 6.6], y: 46, at: 0.35, stagger: 0.3, accent: { 'preuves.': TEA } },
    { type: 'shape', kind: 'bar', x: 50, y: [60, 62], w: [26, 14], h: 0.55, color: TEA, at: 1.5, dur: 0.7, from: { s: 0 } },
  ] },
  // the voice
  { seconds: 4.8, transition: { type: 'zoom', seconds: 0.6 }, bg: { type: 'blobs', colors: ['rgba(204,120,92,.45)', 'rgba(123,97,255,.3)', 'rgba(30,30,60,.5)'], base: '#090912' }, layers: [
    { type: 'text', text: 'Crée ce que tu veux,\noù tu veux.', mode: 'lines', effect: 'mask', size: [8.8, 7], y: 42, at: 0.3, stagger: 0.3, out: { at: 2.5, effect: 'mask' } },
    { type: 'text', text: 'Sans toucher\nl\'écran.', mode: 'lines', effect: 'scale', size: [13, 10], y: 46, at: 2.8, stagger: 0.2, accent: { 'l\'écran.': ORA } },
  ] },
  // the widget
  { seconds: 9.8, transition: { type: 'wipe', seconds: 0.6 }, bg: { type: 'gradient', colors: ['#1c1736', '#090912'], angle: 180, drift: true }, layers: [
    { type: 'text', text: 'Dis-le.\nC\'est fait.', mode: 'lines', effect: 'mask', size: [13, 10.5], x: [50, 22], y: [13, 40], at: 0.3, stagger: 0.25, accent: { 'C\'est': GRN, 'fait.': GRN }, align: 'center', w: [90, 34] },
    { type: 'html', id: 'widget', css: WCSS, markup: WIDGET, design: [1000, 1140], w: [92, 42], x: [50, 72], y: [60, 52], at: 0.2, dur: 0.9, enter: 'rise', tick: widgetTick, cam: { from: { s: 1, y: 1 }, to: { s: 1.04, y: -1 } } },
  ] },
  // the formats
  { seconds: 6.6, transition: { type: 'push', seconds: 0.55 }, bg: { type: 'blobs', colors: ['rgba(38,198,176,.30)', 'rgba(123,97,255,.35)', 'rgba(30,30,60,.5)'], base: '#090912' }, layers: [
    { type: 'text', text: 'Un site. Une appli.\nUn contrat.', mode: 'lines', effect: 'mask', size: [8.4, 6.6], y: [13, 17], at: 0.2, stagger: 0.25 },
    { type: 'html', id: 'cards', css: CCSS, markup: CARDS, design: P ? [1000, 880] : [1700, 340], w: [90, 84], y: [50, 55], at: 0.2, tick: cardsTick },
    { type: 'text', text: 'Pas enfermé dans une plateforme.\nLe code reste dans son dépôt.', mode: 'lines', effect: 'rise', size: [3.8, 3.4], weight: 500, color: '#c9c9d8', y: [87, 87], at: 3.4, stagger: 0.25 },
  ] },
  // the agent
  { seconds: 6.6, transition: { type: 'wipe', seconds: 0.55 }, bg: { type: 'gradient', colors: ['#12172b', '#090912'], angle: 170, drift: true }, layers: [
    { type: 'text', text: 'Un agent\npuissant.', mode: 'lines', effect: 'mask', size: [11, 8.4], x: [50, 22], y: [17, 42], at: 0.25, stagger: 0.25, w: [90, 34] },
    { type: 'html', id: 'rows', css: CCSS, markup: ROWS, design: [1000, 660], w: [90, 52], x: [50, 70], y: [52, 52], at: 0.2, tick: rowsTick },
    { type: 'text', text: 'Un process, des outils, des contrôles.', size: [4.2, 3.6], weight: 700, color: GRN, x: [50, 22], y: [88, 66], w: [90, 34], effect: 'blur', mode: 'words', stagger: 0.06, at: 4.4 },
  ] },
  // the store
  { seconds: 6, transition: { type: 'iris', seconds: 0.6 }, bg: { type: 'blobs', colors: ['rgba(123,97,255,.4)', 'rgba(38,198,176,.3)', 'rgba(30,30,70,.5)'], base: '#090912' }, layers: [
    { type: 'text', text: 'Un store\nsans permission.', mode: 'lines', effect: 'mask', size: [11, 8.6], x: [50, 26], y: [15, 36], at: 0.3, stagger: 0.28, w: [90, 40] },
    { type: 'text', text: 'Aucun comité ne valide.', size: [5, 4.2], weight: 600, color: '#c9c9d8', x: [50, 26], y: [34, 58], w: [90, 40], effect: 'rise', mode: 'words', at: 1.5 },
    { type: 'html', id: 'bars', css: '', markup: BARS, design: [1000, 600], w: [86, 42], x: [50, 72], y: [60, 50], at: 0.5, tick: barsTick },
    { type: 'text', text: 'Classé par ta production d\'AIWA.', size: [4.4, 3.6], weight: 700, color: TEA, x: [50, 26], y: [88, 72], w: [90, 40], effect: 'blur', mode: 'words', at: 3.3, stagger: 0.07 },
  ] },
  // the end
  { seconds: 5.6, transition: { type: 'fade', seconds: 0.7 }, bg: { type: 'blobs', colors: ['rgba(123,97,255,.45)', 'rgba(204,120,92,.3)', 'rgba(38,198,176,.25)'], base: '#090912' }, layers: [
    { type: 'svg', markup: '<svg viewBox="0 0 24 24" width="100%"><path class="d" d="M4 20 L12 4 L20 20 M7.5 14 H16.5"/></svg>', x: 50, y: [32, 34], w: [26, 11], at: 0.2, dur: 1.3, stroke: '#f0f0f5', width: 1.6 },
    { type: 'text', text: 'AIWA', size: [17, 13], upper: true, mode: 'chars', effect: 'mask', stagger: 0.12, at: 1.2, y: [52, 56], spacing: 0.08 },
    { type: 'text', text: 'Remplacer les intermédiaires par des preuves.', size: [4, 3.4], weight: 600, color: '#c9c9d8', y: [66, 69], effect: 'rise', mode: 'lines', at: 2.4 },
    { type: 'text', text: 'theodoreyong9.github.io/Aiwa_store', size: [3.6, 3.1], weight: 600, color: TEA, spacing: 0.03, y: [73, 76], effect: 'blur', mode: 'chars', stagger: 0.02, at: 3.0 },
  ] },
];
</script>
<script src="../../video-kit/template/cinematic.js"></script>
</body></html>
